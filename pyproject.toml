[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "querydoctor"
version = "1.0.0"
description = "A SQL index advisor that proves its recommendations by measuring real before/after performance in a sandbox."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shanu" }]
keywords = ["sql", "sqlite", "index", "query-optimization", "database", "performance", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlglot>=30",
    "typer>=0.15",
    "rich>=13.7",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
querydoctor = "querydoctor.cli:app"

[project.urls]
Homepage = "https://github.com/ContentbyShanu/querydoctor"
Issues = "https://github.com/ContentbyShanu/querydoctor/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/querydoctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore:Using .httpx. with"]

[tool.coverage.run]
source = ["querydoctor"]
branch = true
omit = ["src/querydoctor/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PT"]
ignore = ["B008", "PT018"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/querydoctor"]
